<!DOCTYPE html>
<!--
  ============================================================
  MWAGE 도구 템플릿 (_template.html)
  ============================================================

  새 계산기 추가할 때 이 파일을 복사해서 시작하세요.

  체크리스트 (순서대로):
  1. [TOOL_TITLE], [TOOL_DESC], [TOOL_KEYWORDS] 자리 모두 교체
  2. [CANONICAL_URL] 실제 URL로 (예: https://example.com/tools/severance.html)
  3. JSON-LD의 name/description 업데이트
  4. <h1> 헤더 수정
  5. 입력 필드 정의 (.input-group 블록)
  6. JavaScript의 calc() 함수에 계산 로직 작성
  7. 결과 화면 + breakdown 항목 수정
  8. FAQ 항목 작성 (최소 3개, JSON-LD FAQPage도 함께 갱신)
  9. 부모 sitemap.xml에 URL 추가
  10. index.html "함께 쓰면 좋은 도구" 카드 활성화

  공통 디자인 시스템은 index.html과 동일 — :root 변수 그대로 사용.
-->

  .nav .sep { color: var(--ink-mute); }

  /* 헤더 */
  header { padding: 16px 0 24px; }
  h1 {
    font-family: 'Fraunces', serif;

  .calc-card {

  .input-group { margin-bottom: 18px; }
  .input-group:last-child { margin-bottom: 0; }
  label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  .input-wrap { position: relative; }
  input[type="number"], input[type="text"] {
    width: 100%;
    padding: 16px 60px 16px 18px;
    font-size: 18px;
    font-weight: 600;
    font-family: inherit;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    background: var(--bg);
    color: var(--ink);
    transition: all 0.2s ease;
    -webkit-appearance: none;

  }
</style>
